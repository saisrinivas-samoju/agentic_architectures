[project]
name = "agentic-architectures"
version = "0.1.0"
description = "This repository contains 10 different agentic architecture workflows and decision making workflow to choose the best architecture for your project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6",
    "ddgs>=9.11.3",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.2",
    "langgraph-supervisor>=0.0.31",
    "langgraph-swarm>=0.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
