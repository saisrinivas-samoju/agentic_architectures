      - 5. Orchestrator-Worker: architectures/orchestrator-worker.md
      - 6. Supervisor: architectures/supervisor.md
      - 7. Reflection / Self-Correction: architectures/reflection.md
      - 8. Evaluator-Optimizer: architectures/evaluator-optimizer.md
      - 9. Swarm: architectures/swarm.md
